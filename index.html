<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>东北林业大学物理研讨协会</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f5f7fa;
      color: #222;
      text-align: center;
    }
    header {
      background: #1a3a5c;
      color: white;
      padding: 80px 20px;
    }
    header h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    header p {
      margin: 0;
      opacity: 0.85;
    }
    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: left;
    }
    section {
      background: white;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    h2 {
      margin-top: 0;
      font-size: 20px;
      color: #1a3a5c;
    }
    footer {
      margin: 40px 0 20px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>东北林业大学物理研讨协会</h1>
    <p>探索物理，分享知识</p>
  </header>

  <main>
    <section>
      <h2>关于我们</h2>
      <p>物理研讨协会致力于为同学们提供学术交流、论文分享和科普学习的平台。</p>
    </section>

    <section>
      <h2>论文推荐</h2>
      <p>精选物理学各方向论文，由协会成员推荐并审核分类，供大家学习参考。</p>
    </section>

    <section>
      <h2>学术快线</h2>
      <p>常用物理期刊与预印本平台快捷入口。请在校园网或学校 VPN 环境下使用。</p>
    </section>

    <section>
      <h2>诺奖物理</h2>
      <p>近年诺贝尔物理学奖介绍与解读，按年份归档。</p>
    </section>
  </main>

  <footer>
    © 2026 东北林业大学物理研讨协会
  </footer>
</body>
</html>
